name: site tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    # Pinned: Playwright 1.56 cannot install browsers on Ubuntu 26.04, which is where
    # `ubuntu-latest` now points. Move to a newer Playwright before changing this.
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: python -m playwright install --with-deps chromium
      - name: pytest (smoke, crawlability, meta, accessibility, links, honesty)
        run: pytest -v --tracing retain-on-failure --screenshot only-on-failure --output test-results
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-traces
          path: test-results/
          retention-days: 7
